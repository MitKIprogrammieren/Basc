# Baut FilamentLager Studio (desktop/) als Mac-App (.dmg für Apple Silicon und Intel).
# Bei jedem Push in desktop/ als Download unter "Actions" – bei einem Tag studio-v* zusätzlich als Release.
name: FilamentLager Studio (Mac)

on:
  push:
    paths: ['desktop/**', 'testdaten/**', '.github/workflows/studio-mac.yml']
    tags: ['studio-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: App bauen (ohne Apple-Zertifikat, ad-hoc signiert)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Signatur prüfen
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign -dv "$app" 2>&1 | head -5 || true
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: FilamentLager-Studio-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "FilamentLager Studio ${GITHUB_REF_NAME#studio-v}" \
            --notes "Mac-App zur FilamentLager-Waage. Erster Start mit Rechtsklick auf die App und dann Öffnen."
