# Baut Firmware und Oberfläche der Sensorplatine und den Webflasher.
# main  → Branch "webflasher-bin": FilamentLager-Webflasher.html (alles drin, läuft offline) und die Einzelteile.
# jeder Branch → Build-Protokoll im Branch "ci-protokoll" (Datei <branch>.log), auch wenn der Build scheitert.
name: Firmware Sensorplatine

on:
  push:
    paths:
      - "firmware/sensor-s3zero/**"
      - "firmware/display-5inch/src/model.*"
      - "firmware/display-5inch/src/ha_client.*"
      - "pi/filamentwaage/web/**"
      - "tools/webflasher/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/sensor-s3zero/platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware und Oberfläche bauen
        working-directory: firmware/sensor-s3zero
        run: |
          set -o pipefail
          { pio run && pio run -t buildfs; } 2>&1 | tee /tmp/build.log

      - name: Teile für den Webflasher sammeln
        working-directory: firmware/sensor-s3zero
        run: |
          B=.pio/build/s3zero
          mkdir -p /tmp/aus
          cp $B/bootloader.bin $B/partitions.bin $B/firmware.bin /tmp/aus/
          cp "$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)" /tmp/aus/
          # Oberfläche: leere Blöcke am Ende abschneiden, LittleFS löscht Blöcke vor dem Beschreiben selbst
          python3 - "$B/littlefs.bin" /tmp/aus/littlefs.bin <<'PY'
          import sys
          d = open(sys.argv[1], "rb").read()
          n = len(d.rstrip(b"\xff"))
          n = (n + 4095) // 4096 * 4096
          open(sys.argv[2], "wb").write(d[:n])
          print(f"littlefs.bin: {n // 1024} von {len(d) // 1024} KB")
          PY
          ls -l /tmp/aus

      - name: esptool-js holen
        run: |
          mkdir -p /tmp/ej && cd /tmp/ej
          npm pack esptool-js@0.5.7 >/dev/null
          tar xzf esptool-js-*.tgz
          cp package/bundle.js /tmp/aus/esptool-js.mjs
          cp package/LICENSE /tmp/aus/esptool-js.LICENSE.txt 2>/dev/null || true

      - name: Webflasher bauen
        run: |
          FW=$(grep -oP 'FW_VERSION "\K[^"]+' firmware/sensor-s3zero/include/config.h)
          OFS=$(awk -F, '$1 ~ /^spiffs/ {gsub(/ /,"",$4); print $4}' firmware/sensor-s3zero/partitions.csv)
          python3 tools/webflasher/bauen.py --version "$FW" --esptool /tmp/aus/esptool-js.mjs \
            --teil 0x0=/tmp/aus/bootloader.bin --teil 0x8000=/tmp/aus/partitions.bin \
            --teil 0xe000=/tmp/aus/boot_app0.bin --teil 0x10000=/tmp/aus/firmware.bin \
            --teil "$OFS=/tmp/aus/littlefs.bin" \
            --aus /tmp/aus/FilamentLager-Webflasher.html 2>&1 | tee -a /tmp/build.log
          printf '{"fw":"%s","commit":"%s","littlefs":"%s"}\n' "$FW" "${GITHUB_SHA::7}" "$OFS" > /tmp/aus/version.json

      - name: In den Branch webflasher-bin legen
        if: github.ref == 'refs/heads/main'
        run: |
          cd /tmp/aus
          git init -q -b webflasher-bin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Firmware $(grep -oP '"fw":"\K[^"]+' version.json) (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" webflasher-bin

      - name: Protokoll ablegen
        if: always()
        run: |
          BR="${GITHUB_REF_NAME//\//-}"
          mkdir -p /tmp/log && cd /tmp/log
          git init -q -b ci-protokoll
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch -q --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-protokoll 2>/dev/null && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          { echo "commit ${GITHUB_SHA::7} · ergebnis ${{ job.status }}"; tail -c 60000 /tmp/build.log 2>/dev/null; } > "$BR.log"
          git add -A
          git commit -qm "Protokoll $BR ${GITHUB_SHA::7} (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-protokoll
