# FilamentLager-Waage auf dem BTT Pad 7
# Diese Datei VOR dem ersten Start auf der SD-Karte (Partition BOOT, Ordner filamentwaage) bearbeiten.
# Das Installationsskript kopiert sie nach /etc/filamentwaage/config.toml.

[home_assistant]
url = "http://homeassistant.local:8123"
# Langlebiges Zugriffstoken: HA → Profil → Sicherheit → Langlebige Zugriffstokens
token = ""
todo = "todo.filament"
zertifikat_pruefen = true

[sensor]
# Die Sensorplatine (ESP32-S3-Zero) in der Waage funkt per WLAN.
art = "wlan"
# Name der Waage im Heimnetz. Klappt das nicht, hier die IP-Adresse aus der FritzBox eintragen,
# z. B. "192.168.178.57" (und in der FritzBox "immer dieselbe IP-Adresse zuweisen" anhaken).
wlan_adresse = "filamentwaage.local"
wlan_port = 4711

[waage]
leerspule_g = 250
lager_neu_laden_s = 60

[server]
# "0.0.0.0" = Oberfläche auch im Heimnetz öffnen: http://<pad7>:8080
adresse = "127.0.0.1"
port = 8080
