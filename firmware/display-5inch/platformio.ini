; Display-Firmware für das Waveshare ESP32-S3-Touch-LCD-5 (800×480, Touch, SKU 28117)
; Bauen und flashen:  pio run -t upload   (USB-C-Buchse am Board)
; Vorher include/secrets.example.h nach include/secrets.h kopieren und ausfüllen.

[env:ws5]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.1
    moononournation/GFX Library for Arduino@1.4.9
build_src_filter = +<*>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
