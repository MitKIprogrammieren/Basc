; Display-Firmware der FilamentLager-Waage, zwei Displays:
;   env:ws5       Waveshare ESP32-S3-Touch-LCD-5 (800×480, Touch, SKU 28117)
;   env:sc01plus  WT32-SC01 Plus (3,5", 480×320, ST7796, Touch FT6336U)
;   env:sc01plus_direkt  SC01 Plus ohne Sensorplatine: NAU7802 + zwei PN532 direkt am Display
; Bauen und flashen:  pio run -e ws5 -t upload   bzw.   pio run -e sc01plus -t upload   (USB-C-Buchse am Board)
; Vorher include/secrets.example.h nach include/secrets.h kopieren und ausfüllen.

[platformio]
default_envs = ws5

[env:ws5]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.1
    moononournation/GFX Library for Arduino@1.4.9
build_src_filter = +<*> -<board_sc01plus.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; WT32-SC01 Plus: ESP32-S3 mit 16 MB Flash und 2 MB Quad-PSRAM.
; Gleiche Oberfläche in kompakter Anordnung (UI_KOMPAKT), eigener Display-/Touch-Treiber.
[env:sc01plus]
extends = env:ws5
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags =
    ${env:ws5.build_flags}
    -DBOARD_SC01PLUS
    -DUI_KOMPAKT=1
build_src_filter = +<*> -<board.cpp>

; WT32-SC01 Plus ohne Sensorplatine: NAU7802 und zwei PN532 hängen direkt am Display, dazu die Web-Oberfläche
; der Sensorplatine (http://filamentwaage-2.local).
; Treiber kommen aus firmware/sensor-s3zero/src (src/treiber_*.cpp binden sie ein – gleicher Code wie auf der Sensorplatine).
[env:sc01plus_direkt]
extends = env:sc01plus
build_flags =
    ${env:sc01plus.build_flags}
    -DSENSOR_DIREKT=1
    -Isrc
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
lib_deps =
    ${env:ws5.lib_deps}
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0
    h2zero/NimBLE-Arduino@^1.4.3
    LittleFS
    FS
    Update
    ESPmDNS
    WiFiClientSecure
    HTTPClient
; Web-Oberfläche: Dateien aus pi/filamentwaage/web landen gzip-komprimiert in data/ und im LittleFS
; (Partition „spiffs“ aus default_16MB.csv, ab 0xC90000). Bauen: pio run -e sc01plus_direkt -t buildfs
board_build.filesystem = littlefs
extra_scripts = pre:../sensor-s3zero/tools/web_daten.py
