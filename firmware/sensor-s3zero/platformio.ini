; Sensor-Firmware für den Waveshare ESP32-S3-Zero: Wägezelle (HX711) + 2× PN532 (HSU).
; Spricht das Protokoll aus docs/PROTOKOLL.md gleichzeitig über
;  - RS485 (zum 5"-Display) und
;  - USB (zum Raspberry Pi) und
;  - WLAN, TCP-Port 4711 (zum BTT Pad 7 oder Pi ohne Kabel).
; Flashen: BOOT gedrückt halten, USB einstecken, dann  pio run -t upload

[env:s3zero]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^7.2.1
    tzapu/WiFiManager@^2.0.17
monitor_speed = 115200
