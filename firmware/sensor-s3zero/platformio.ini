; Sensor-Firmware für den Waveshare ESP32-S3-Zero: Wägezelle (NAU7802) + 2× PN532 (HSU).
; Liefert außerdem die komplette Waagen-Oberfläche unter http://filamentwaage.local aus.
; Spricht das Protokoll aus docs/PROTOKOLL.md gleichzeitig über
;  - RS485 (zum 5"-Display) und
;  - USB (zum Raspberry Pi) und
;  - WLAN, TCP-Port 4711 (zum BTT Pad 7 oder Pi ohne Kabel).
; Flashen: BOOT gedrückt halten, USB einstecken, dann
;   pio run -t upload       (Firmware)
;   pio run -t uploadfs     (Oberfläche – Dateien kommen aus pi/filamentwaage/web, siehe tools/web_daten.py)
; Einfacher: FilamentLager-Webflasher.html aus dem Branch webflasher-bin.

[env:s3zero]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/web_daten.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -I../display-5inch/src
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    tzapu/WiFiManager@^2.0.17
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0
    h2zero/NimBLE-Arduino@^1.4.3
monitor_speed = 115200

; ESP32-S3-DevKitC-1 N16R8 (z. B. diymore mit Antennenbuchse): 16 MB Flash, 8 MB Octal-PSRAM.
; Gleiche Pins wie der Super Mini. Octal-PSRAM braucht eine eigene Firmware – die s3zero-Firmware fände dort
; keinen Zusatzspeicher. Die Partitionen bleiben gleich (Einstellungen und Update über WLAN wie gewohnt).
; Mit externer Antenne volle Sendeleistung.
[env:n16r8]
extends = env:s3zero
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env:s3zero.build_flags}
    -DWLAN_LEISE=0
